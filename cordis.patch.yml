# Token Market provider bundle for DeepSeek Harness.
# The API key is resolved from TOKENSMARKET_API_KEY at request time.
- insert:
    - id: llm-pi-ai-tokensmarket
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          tokensmarket:
            displayName: Token Market
            apiKeyEnv: TOKENSMARKET_API_KEY
            api: openai-completions
            baseURL: https://api.tokensmarket.ai/v1
            compat:
              thinkingFormat: deepseek
            retryPolicy:
              mode: normal
              maxRetries: 3
            models:
              - id: deepseek-v4-pro
                name: DeepSeek V4 Pro
                contextWindow: 1000000
                maxTokens: 384000
                input:
                  - text
                reasoningEfforts:
                  off: none
                  high: high
                  max: max
              - id: kimi-k3
                name: Kimi K3
                contextWindow: 1048576
                maxTokens: 131072
                input:
                  - text
                  - image
                reasoningEfforts:
                  off: none
                  high: high
                  max: max
              - id: glm-5.3
                name: GLM-5.3
                contextWindow: 1000000
                maxTokens: 131072
                input:
                  - text
                reasoningEfforts:
                  low: low
                  high: high
                  max: max
